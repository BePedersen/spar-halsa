<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta http.equiv="refresh" content="300">
    <title>SPAR-Visning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', sans-serif;
        }
        .section {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }
        .carousel-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
            height: 100%;
        }
        .slide {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 100%;
            height: 100%;
            gap: 4vw;
            padding: 0 5vw;
        }
        .offer {
            width: 40%;
            height: 85%;
            background: #ffffff;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .offer img {
            max-height: 55vh;
            object-fit: contain;
            border-radius: 15px;
        }
        .offer h2 {
            font-size: 4em;
            margin: 10px 0 5px 0;
            color: #333;
        }
        .offer p {
            font-size: 1.8em;
            color: #666;
            margin: 0;
        }
        .offer strong {
            font-size: 8em;
            color: #d00000;
            margin-top: 10px;
        }
        .video-section video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        .gallery-section {
            background: #f5f5f5;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .gallery img {
            max-height: 80vh;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #d00000;
            font-size: 3em;
        }
    </style>
</head>
<body>

    <!-- Seksjon 1: Tilbud -->
    <div class="section active" id="section1">
        <h1>Ukens tilbud</h1>
        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
    <div class="slide">

                <div class="offer">
                    <img src="https://res.cloudinary.com/norgesgruppen/image/upload/c_fill,f_jpg,h_318,q_auto:eco,w_424/mhhcgg9wwevxtcxyhuhr.jpg" alt="Norvegia">
                    <h2>Norvegia</h2>
                    <p>TINE, original/smaksrik, 830 g Førpris: 132,00–162,00</p>
                    <strong>79,90</strong>
                </div>
                
                <div class="offer">
                    <img src="https://res.cloudinary.com/norgesgruppen/image/upload/c_fill,f_jpg,h_318,q_auto:eco,w_424/gt2cwtkkag56ts0dozhv.jpg" alt="Jif">
                    <h2>Jif</h2>
                    <p>et stort utvalg</p>
                    <strong>-40 %</strong>
                </div>
                </div>
<div class="slide">

                <div class="offer">
                    <img src="https://res.cloudinary.com/norgesgruppen/image/upload/c_fill,f_jpg,h_318,q_auto:eco,w_424/ulektixilvalvyrsow3h.jpg" alt="Norske tomater">
                    <h2>Norske tomater</h2>
                    <p>løsvekt, pr. kg</p>
                    <strong>29,90</strong>
                </div>
                
                <div class="offer">
                    <img src="https://res.cloudinary.com/norgesgruppen/image/upload/c_fill,f_jpg,h_318,q_auto:eco,w_424/zupblqisonjvglnxtvvw.jpg" alt="Italiensk uke">
                    <h2>Italiensk uke</h2>
                    <p>et stort utvalg</p>
                    <strong>-40 %</strong>
                </div>
                </div>
<div class="slide">

                <div class="offer">
                    <img src="https://res.cloudinary.com/norgesgruppen/image/upload/c_fill,f_jpg,h_318,q_auto:eco,w_424/x6ktxn2hmlxu7e74pt2l.jpg" alt="Nygrillede kyllinglår">
                    <h2>Nygrillede kyllinglår</h2>
                    <p>pr. stk. Førpris: 34,90 Fra vårt varmeskap</p>
                    <strong>19,90</strong>
                </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Seksjon 2: Video -->
    <div class="section video-section" id="section2">
        <video src="video.mp4" autoplay muted loop></video>
    </div>

    <!-- Seksjon 3: Galleri -->
    <div class="section gallery-section" id="section3">
        <div class="gallery">
            <img src="bilder/bilde2.jpg" alt="bilde2.jpg">
<img src="bilder/bilde1.jpg" alt="bilde1.jpg">

        </div>
    </div>

    <script>
        // Karusell
        const track = document.getElementById('carouselTrack');
        const slides = document.querySelectorAll('.slide');
        let slideIndex = 0;
        setInterval(() => {
            slideIndex = (slideIndex + 1) % slides.length;
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
        }, 4000);

        // Roter: tilbud → bilde → video → bilde → ...
        const s1 = document.getElementById('section1');
        const s2 = document.getElementById('section2');
        const s3 = document.getElementById('section3');
        const rotationOrder = [s1, s3, s2, s3];
        let sectionIndex = 0;

        setInterval(() => {
            [s1, s2, s3].forEach(s => s.classList.remove('active'));
            rotationOrder[sectionIndex].classList.add('active');
            sectionIndex = (sectionIndex + 1) % rotationOrder.length;
        }, 8000);
    </script>
</body>
</html>
